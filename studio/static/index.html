<script>/* theme before the first paint: saved choice, else the system setting */
(function(){var t=null;try{t=localStorage.getItem("fo.theme")}catch(e){}
if(t)t=JSON.parse(t);if(t!=="dark"&&t!=="light")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.dataset.theme=t;})();</script>
